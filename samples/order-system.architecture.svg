b" x="594" y="254" text-anchor="middle">支付网关适配</text></g><g class="role-neutral"><rect class="node" x="290" y="374" width="96" height="46" rx="8"/><text class="n-label" x="338" y="392" text-anchor="middle">MySQL</text><text class="n-sub" x="338" y="406" text-anchor="middle">订单主库</text></g><g class="role-neutral"><rect class="node" x="402" y="374" width="96" height="46" rx="8"/><text class="n-label" x="450" y="392" text-anchor="middle">Redis</text><text class="n-sub" x="450" y="406" text-anchor="middle">幂等锁</text></g><g class="role-interaction"><rect class="node" x="514" y="374" width="96" height="46" rx="8"/><text class="n-label" x="562" y="392" text-anchor="middle">RocketMQ</text><text class="n-sub" x="562" y="406" text-anchor="middle">订单事件</text></g><g class="legend"><rect class="legend-box" x="644" y="392" width="232" height="84" rx="6"/><rect class="role-control" x="654" y="395" width="14" height="14" rx="3"/><text class="legend-label" x="676" y="404" text-anchor="start">控制</text><rect class="role-capability" x="654" y="413" width="14" height="14" rx="3"/><text class="legend-label" x="676" y="422" text-anchor="start">能力</text><rect class="role-interaction" x="654" y="431" width="14" height="14" rx="3"/><text class="legend-label" x="676" y="440" text-anchor="start">交互</text><rect class="role-neutral" x="654" y="449" width="14" height="14" rx="3"/><text class="legend-label" x="676" y="458" text-anchor="start">中性</text></g></svg>