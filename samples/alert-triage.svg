<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 317 650" width="317" height="650" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>线上告警分级决策树</title><desc>图 2-2 · 线上告警分级决策树（P0 / P1 / P2 三级出口）</desc><style>:root {
--canvas: #f8fafc;
--panel: #ffffff;
--panel-border: #e2e8f0;
--text: #0f172a;
--muted: #64748b;
