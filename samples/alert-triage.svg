<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 363 702" width="363" height="702" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>线上告警分级决策树</title><desc>图 2-2 · 线上告警分级决策树（P0 / P1 / P2 三级出口）</desc><style>:root {
--canvas: #f8fafc;
--panel: #ffffff;
--panel-border: #e2e8f0;
--text: #0f172a;
--muted: #475569;
--arrow: #94a3b8;
--grid: #e2e8f0;
--role-control-fill: #fdf4ff;
--role-control-stroke: #a855f7;
--role-control-text: #7e22ce;
--role-capability-fill: #f0fdf4;
--role-capability-stroke: #22c55e;
--role-capability-text: #166534;
--role-interaction-fill: #eff6ff;
--role-interaction-stroke: #3b82f6;
--role-interaction-text: #1e40af;
--role-warn-fill: #fef2f2;
--role-warn-stroke: #ef4444;
--role-warn-text: #b91c1c;
--role-neutral-fill: #f8fafc;
--role-neutral-stroke: #94a3b8;
--role-neutral-text: #334155;
}
@media (prefers-color-scheme: dark) {
  :root {
  --canvas: #0f172a;
  --panel: #1e293b;
  --panel-border: #334155;
  --text: #e2e8f0;
  --muted: #cbd5e1;
  --arrow: #64748b;
  --grid: #1e293b;
  --role-control-fill: rgba(168,85,247,0.18);
  --role-control-stroke: #c084fc;
  --role-control-text: #e9d5ff;
  --role-capability-fill: rgba(74,222,128,0.16);
  --role-capability-stroke: #4ade80;
  --role-capability-text: #bbf7d0;
  --role-interaction-fill: rgba(96,165,250,0.16);
  --role-interaction-stroke: #60a5fa;
  --role-interaction-text: #dbeafe;
  --role-warn-fill: rgba(239,68,68,0.16);
  --role-warn-stroke: #f87171;
  --role-warn-text: #fecaca;
  --role-neutral-fill: rgba(148,163,184,0.14);
  --role-neutral-stroke: #94a3b8;
  --role-neutral-text: #cbd5e1;
  }
}

svg { background: var(--canvas); }
text { stroke: none; }
.title { fill: var(--text); font-size: 24px; font-weight: 700; }
.desc { fill: var(--muted); font-size: 12px; }
.caption { fill: var(--muted); font-size: 12px; }
.frame { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.25; }
.frame-label { fill: var(--text); font-size: 13px; font-weight: 700; }
.node { stroke-width: 1.5; }
.n-label { fill: var(--text); font-size: 16px; font-weight: 700; dominant-baseline: central; }
.n-sub { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
.edge { fill: none; stroke: var(--arrow); stroke-width: 2; }
.edge-dashed { stroke-dasharray: 5 4; }
.edge-label { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
.lifeline { fill: none; stroke: var(--arrow); stroke-width: 1.5; stroke-dasharray: 4 4; }
.legend-box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1; }
.legend-label { fill: var(--text); font-size: 12px; dominant-baseline: central; }
.arrow-fill { fill: var(--arrow); }
.arrow-line { fill: none; stroke: var(--arrow); stroke-width: 1.4; }
.role-control { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-control .node { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-capability { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-capability .node { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-interaction { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-interaction .node { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-warn { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-warn .node { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-neutral { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }
.role-neutral .node { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }</style><style>.edge-label-bg{fill:var(--canvas);stroke:none;}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-fill" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="arrow-async" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker><marker id="arrow-fallback" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker></defs><text class="title" x="181.5" y="32" text-anchor="middle">线上告警分级决策树</text><path class="edge" d="M 181 114 L 181 202" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="180" y="151" width="30" height="14" rx="3"/><text class="edge-label" x="195" y="161" text-anchor="middle">评估</text><path class="edge" d="M 181 260 L 181 304 L 251 304 L 251 348" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="206.5" y="311" width="19" height="14" rx="3"/><text class="edge-label" x="216" y="321" text-anchor="middle">是</text><path class="edge" d="M 181 260 L 181 304 L 101 304 L 101 348" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="131.5" y="311" width="19" height="14" rx="3"/><text class="edge-label" x="141" y="321" text-anchor="middle">否</text><path class="edge" d="M 101 406 L 101 494" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="65.5" y="443" width="19" height="14" rx="3"/><text class="edge-label" x="75" y="453" text-anchor="middle">是</text><path class="edge" d="M 101 406 L 101 450 L 266 450 L 266 494" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="174.5" y="457" width="19" height="14" rx="3"/><text class="edge-label" x="184" y="467" text-anchor="middle">否</text><g class="role-warn"><rect class="node" x="128" y="56" width="107" height="58" rx="8"/><text class="n-label" x="181" y="76" text-anchor="middle">告警触发</text><text class="n-sub" x="181" y="94" text-anchor="middle">AlertManager</text></g><g class="role-control"><rect class="node" x="117" y="202" width="129" height="58" rx="8"/><text class="n-label" x="181" y="222" text-anchor="middle">影响面 ≥ 30%</text><text class="n-sub" x="181" y="240" text-anchor="middle">ScopeJudge</text></g><g class="role-control"><rect class="node" x="39" y="348" width="124" height="58" rx="8"/><text class="n-label" x="101" y="368" text-anchor="middle">核心链路受损</text><text class="n-sub" x="101" y="386" text-anchor="middle">PathJudge</text></g><g class="role-warn"><rect class="node" x="179" y="348" width="145" height="58" rx="8"/><text class="n-label" x="251" y="368" text-anchor="middle">P0 电话 + 拉群</text><text class="n-sub" x="251" y="386" text-anchor="middle">5 分钟响应</text></g><g class="role-interaction"><rect class="node" x="24" y="494" width="154" height="58" rx="8"/><text class="n-label" x="101" y="514" text-anchor="middle">P1 值班 IM 通知</text><text class="n-sub" x="101" y="532" text-anchor="middle">30 分钟响应</text></g><g class="role-neutral"><rect class="node" x="194" y="494" width="145" height="58" rx="8"/><text class="n-label" x="266" y="514" text-anchor="middle">P2 工单 + 邮件</text><text class="n-sub" x="266" y="532" text-anchor="middle">次工作日处理</text></g><g class="legend"><rect class="legend-box" x="99" y="568" width="240" height="84" rx="6"/><rect class="role-control" x="109" y="571" width="14" height="14" rx="3"/><text class="legend-label" x="131" y="580" text-anchor="start">控制</text><rect class="role-interaction" x="109" y="589" width="14" height="14" rx="3"/><text class="legend-label" x="131" y="598" text-anchor="start">交互</text><rect class="role-warn" x="109" y="607" width="14" height="14" rx="3"/><text class="legend-label" x="131" y="616" text-anchor="start">告警</text><rect class="role-neutral" x="109" y="625" width="14" height="14" rx="3"/><text class="legend-label" x="131" y="634" text-anchor="start">中性</text></g><text class="caption" x="181.5" y="691" text-anchor="middle">图 2-2 · 线上告警分级决策树（P0 / P1 / P2 三级出口）</text></svg>