<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>CI 发布流水线</title><desc>图 2-1 · CI 发布流水线（提交 → 构建 → 验证 → 发布）</desc><style>:root {
--canvas: #f8fafc;
--panel: #ffffff;
--panel-border: #e2e8f0;
--text: #0f172a;
--muted: #475569;
--arrow: #94a3b8;
--grid: #e2e8f0;
--role-control-fill: #fdf4ff;
--role-control-stroke: #a855f7;
--role-control-text: #7e22ce;
--role-capability-fill: #f0fdf4;
--role-capability-stroke: #22c55e;
--role-capability-text: #166534;
--role-interaction-fill: #eff6ff;
--role-interaction-stroke: #3b82f6;
--role-interaction-text: #1e40af;
--role-warn-fill: #fef2f2;
--role-warn-stroke: #ef4444;
--role-warn-text: #b91c1c;
--role-neutral-fill: #f8fafc;
--role-neutral-stroke: #94a3b8;
--role-neutral-text: #334155;
}
@media (prefers-color-scheme: dark) {
  :root {
  --canvas: #0f172a;
  --panel: #1e293b;
  --panel-border: #334155;
  --text: #e2e8f0;
  --muted: #cbd5e1;
  --arrow: #64748b;
  --grid: #1e293b;
  --role-control-fill: rgba(168,85,247,0.18);
  --role-control-stroke: #c084fc;
  --role-control-text: #e9d5ff;
  --role-capability-fill: rgba(74,222,128,0.16);
  --role-capability-stroke: #4ade80;
  --role-capability-text: #bbf7d0;
  --role-interaction-fill: rgba(96,165,250,0.16);
  --role-interaction-stroke: #60a5fa;
  --role-interaction-text: #dbeafe;
  --role-warn-fill: rgba(239,68,68,0.16);
  --role-warn-stroke: #f87171;
  --role-warn-text: #fecaca;
  --role-neutral-fill: rgba(148,163,184,0.14);
  --role-neutral-stroke: #94a3b8;
  --role-neutral-text: #cbd5e1;
  }
}

svg { background: var(--canvas); }
.title { fill: var(--text); font-size: 24px; font-weight: 700; }
.desc { fill: var(--muted); font-size: 12px; }
.caption { fill: var(--muted); font-size: 12px; }
.frame { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.25; }
.frame-label { fill: var(--text); font-size: 13px; font-weight: 700; }
.node { stroke-width: 1.5; }
.n-label { fill: var(--text); font-size: 16px; font-weight: 700; dominant-baseline: central; }
.n-sub { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
.edge { fill: none; stroke: var(--arrow); stroke-width: 2; }
.edge-dashed { stroke-dasharray: 5 4; }
.edge-label { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
.lifeline { fill: none; stroke: var(--arrow); stroke-width: 1.5; stroke-dasharray: 4 4; }
.legend-box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1; }
.legend-label { fill: var(--text); font-size: 12px; dominant-baseline: central; }
.arrow-fill { fill: var(--arrow); }
.arrow-line { fill: none; stroke: var(--arrow); stroke-width: 1.4; }
.role-control { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-control .node { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-capability { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-capability .node { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-interaction { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-interaction .node { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-warn { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-warn .node { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-neutral { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }
.role-neutral .node { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }</style><style>.edge-label-bg{fill:var(--canvas);stroke:none;}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-fill" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="arrow-async" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker><marker id="arrow-fallback" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker></defs><text class="title" x="440" y="32" text-anchor="middle">CI 发布流水线</text><g><rect class="frame" x="24" y="56" width="160" height="204" rx="10"/><text class="frame-label" x="36" y="74">提交</text></g><g><rect class="frame" x="248" y="56" width="160" height="204" rx="10"/><text class="frame-label" x="260" y="74">构建</text></g><g><rect class="frame" x="472" y="56" width="160" height="204" rx="10"/><text class="frame-label" x="484" y="74">验证</text></g><g><rect class="frame" x="696" y="56" width="160" height="204" rx="10"/><text class="frame-label" x="708" y="74">发布</text></g><path class="edge" d="M 153 103 L 280 103" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="186.88" y="110" width="60.25" height="14" rx="3"/><text class="edge-label" x="217" y="120" text-anchor="middle">push 事件</text><path class="edge" d="M 376 103 L 490 103" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="407" y="120" width="52" height="14" rx="3"/><text class="edge-label" x="433" y="130" text-anchor="middle">构建产物</text><path class="edge" d="M 615 103 L 722 103" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="643" y="110" width="52" height="14" rx="3"/><text class="edge-label" x="669" y="120" text-anchor="middle">门禁通过</text><path class="edge edge-dashed" d="M 490 103 L 376 103" marker-end="url(#arrow-fallback)"/><rect class="edge-label-bg" x="392.98" y="140" width="80.05" height="14" rx="3"/><text class="edge-label" x="433" y="150" text-anchor="middle">失败·修复重跑</text><path class="edge edge-dashed" d="M 776 132 L 776 202" marker-end="url(#arrow-fallback)"/><rect class="edge-label-bg" x="764" y="160" width="52" height="14" rx="3"/><text class="edge-label" x="790" y="170" text-anchor="middle">指标越限</text><g class="role-interaction"><rect class="node" x="55" y="74" width="98" height="58" rx="8"/><text class="n-label" x="104" y="94" text-anchor="middle">Git Push</text><text class="n-sub" x="104" y="112" text-anchor="middle">触发流水线</text></g><g class="role-capability"><rect class="node" x="280" y="74" width="96" height="58" rx="8"/><text class="n-label" x="328" y="94" text-anchor="middle">Build</text><text class="n-sub" x="328" y="112" text-anchor="middle">编译 + 单测</text></g><g class="role-control"><rect class="node" x="490" y="74" width="125" height="58" rx="8"/><text class="n-label" x="552" y="94" text-anchor="middle">QualityGate</text><text class="n-sub" x="552" y="112" text-anchor="middle">覆盖率门禁</text></g><g class="role-capability"><rect class="node" x="722" y="74" width="109" height="58" rx="8"/><text class="n-label" x="776" y="94" text-anchor="middle">Deploy</text><text class="n-sub" x="776" y="112" text-anchor="middle">灰度 10% 起步</text></g><g class="role-warn"><rect class="node" x="726" y="202" width="100" height="58" rx="8"/><text class="n-label" x="776" y="222" text-anchor="middle">Rollback</text><text class="n-sub" x="776" y="240" text-anchor="middle">异常自动回滚</text></g><g class="legend"><rect class="legend-box" x="616" y="276" width="240" height="84" rx="6"/><rect class="role-control" x="626" y="279" width="14" height="14" rx="3"/><text class="legend-label" x="648" y="288" text-anchor="start">控制</text><rect class="role-capability" x="626" y="297" width="14" height="14" rx="3"/><text class="legend-label" x="648" y="306" text-anchor="start">能力</text><rect class="role-interaction" x="626" y="315" width="14" height="14" rx="3"/><text class="legend-label" x="648" y="324" text-anchor="start">交互</text><rect class="role-warn" x="626" y="333" width="14" height="14" rx="3"/><text class="legend-label" x="648" y="342" text-anchor="start">告警</text></g><text class="caption" x="440" y="399" text-anchor="middle">图 2-1 · CI 发布流水线（提交 → 构建 → 验证 → 发布）</text></svg>