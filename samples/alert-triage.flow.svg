<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 542" width="1080" height="542" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>线上告警分级决策树</title><desc>图 2-2 · 线上告警分级决策树（P0 / P1 / P2 三级出口）</desc><style>:root {
--canvas: #f8fafc;
