<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 793 688" width="793" height="688" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>OAuth 2.0 授权码模式登录时序</title><desc>图 3-1 · OAuth 2.0 授权码模式：浏览器首次登录完整时序</desc><style>:root {
--canvas: #f8fafc;
--panel: #ffffff;
--panel-border: #e2e8f0;
--text: #0f172a;
--muted: #475569;
--arrow: #94a3b8;
--grid: #e2e8f0;
--role-control-fill: #fdf4ff;
--role-control-stroke: #a855f7;
--role-control-text: #7e22ce;
--role-capability-fill: #f0fdf4;
--role-capability-stroke: #22c55e;
--role-capability-text: #166534;
--role-interaction-fill: #eff6ff;
--role-interaction-stroke: #3b82f6;
--role-interaction-text: #1e40af;
--role-warn-fill: #fef2f2;
--role-warn-stroke: #ef4444;
--role-warn-text: #b91c1c;
--role-neutral-fill: #f8fafc;
--role-neutral-stroke: #94a3b8;
--role-neutral-text: #334155;
}
@media (prefers-color-scheme: dark) {
  :root {
  --canvas: #0f172a;
  --panel: #1e293b;
  --panel-border: #334155;
  --text: #e2e8f0;
  --muted: #cbd5e1;
  --arrow: #64748b;
  --grid: #1e293b;
  --role-control-fill: rgba(168,85,247,0.18);
  --role-control-stroke: #c084fc;
  --role-control-text: #e9d5ff;
  --role-capability-fill: rgba(74,222,128,0.16);
  --role-capability-stroke: #4ade80;
  --role-capability-text: #bbf7d0;
  --role-interaction-fill: rgba(96,165,250,0.16);
  --role-interaction-stroke: #60a5fa;
  --role-interaction-text: #dbeafe;
  --role-warn-fill: rgba(239,68,68,0.16);
  --role-warn-stroke: #f87171;
  --role-warn-text: #fecaca;
  --role-neutral-fill: rgba(148,163,184,0.14);
  --role-neutral-stroke: #94a3b8;
  --role-neutral-text: #cbd5e1;
  }
}

svg { background: var(--canvas); }
text { stroke: none; }
.title { fill: var(--text); font-size: 24px; font-weight: 700; }
.desc { fill: var(--muted); font-size: 12px; }
.caption { fill: var(--muted); font-size: 12px; }
.frame { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.25; }
.frame-label { fill: var(--text); font-size: 13px; font-weight: 700; }
.node { stroke-width: 1.5; }
.n-label { fill: var(--text); font-size: 16px; font-weight: 700; dominant-baseline: central; }
.n-sub { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
.edge { fill: none; stroke: var(--arrow); stroke-width: 2; }
.edge-dashed { stroke-dasharray: 5 4; }
.edge-label { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
.lifeline { fill: none; stroke: var(--arrow); stroke-width: 1.5; stroke-dasharray: 4 4; }
.legend-box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1; }
.legend-label { fill: var(--text); font-size: 12px; dominant-baseline: central; }
.arrow-fill { fill: var(--arrow); }
.arrow-line { fill: none; stroke: var(--arrow); stroke-width: 1.4; }
.role-control { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-control .node { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-capability { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-capability .node { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-interaction { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-interaction .node { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-warn { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-warn .node { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-neutral { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }
.role-neutral .node { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }</style><style>.edge-label-bg{fill:var(--canvas);stroke:none;}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-fill" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="arrow-async" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker><marker id="arrow-fallback" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker></defs><text class="title" x="396.5" y="32" text-anchor="middle">OAuth 2.0 授权码模式登录时序</text><path class="lifeline" d="M 71.8 96 L 71.8 556"/><path class="lifeline" d="M 283.4 96 L 283.4 556"/><path class="lifeline" d="M 495 96 L 495 556"/><path class="lifeline" d="M 706.6 96 L 706.6 556"/><path class="edge" d="M 71.8 108 L 283.4 108" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="110.2" y="115" width="135.6" height="14" rx="3"/><text class="edge-label" x="178" y="125" text-anchor="middle">GET /profile（未登录）</text><path class="edge edge-dashed" d="M 283.4 152 L 71.8 152" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="139.35" y="159" width="77.3" height="14" rx="3"/><text class="edge-label" x="178" y="169" text-anchor="middle">302 → 授权页</text><path class="edge" d="M 71.8 196 L 495 196" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="302.65" y="189" width="92.7" height="14" rx="3"/><text class="edge-label" x="349" y="199" text-anchor="middle">GET /authorize</text><path class="edge edge-dashed" d="M 495 240 L 71.8 240" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="302.73" y="233" width="96.55" height="14" rx="3"/><text class="edge-label" x="351" y="243" text-anchor="middle">302 + code 回调</text><path class="edge" d="M 71.8 284 L 283.4 284" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="119.55" y="291" width="116.9" height="14" rx="3"/><text class="edge-label" x="178" y="301" text-anchor="middle">GET /callback?code</text><path class="edge" d="M 283.4 328 L 495 328" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="309.1" y="335" width="159.8" height="14" rx="3"/><text class="edge-label" x="389" y="345" text-anchor="middle">POST /token（code 换令牌）</text><path class="edge edge-dashed" d="M 495 372 L 283.4 372" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="348.7" y="379" width="80.6" height="14" rx="3"/><text class="edge-label" x="389" y="389" text-anchor="middle">access_token</text><path class="edge" d="M 283.4 416 L 706.6 416" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="516.63" y="409" width="120.75" height="14" rx="3"/><text class="edge-label" x="577" y="419" text-anchor="middle">GET /user（Bearer）</text><path class="edge edge-dashed" d="M 706.6 460 L 283.4 460" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="513" y="453" width="52" height="14" rx="3"/><text class="edge-label" x="539" y="463" text-anchor="middle">用户资源</text><path class="edge edge-dashed" d="M 283.4 504 L 71.8 504" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="134.4" y="511" width="87.2" height="14" rx="3"/><text class="edge-label" x="178" y="521" text-anchor="middle">200 渲染个人页</text><g class="role-interaction"><rect class="node" x="24" y="56" width="96" height="42" rx="8"/><text class="n-label" x="72" y="77" text-anchor="middle">浏览器</text></g><g class="role-control"><rect class="node" x="222" y="56" width="122" height="42" rx="8"/><text class="n-label" x="283" y="77" text-anchor="middle">WebApp 后端</text></g><g class="role-control"><rect class="node" x="432" y="56" width="125" height="42" rx="8"/><text class="n-label" x="495" y="77" text-anchor="middle">AuthService</text></g><g class="role-capability"><rect class="node" x="644" y="56" width="125" height="42" rx="8"/><text class="n-label" x="707" y="77" text-anchor="middle">ResourceAPI</text></g><g class="legend"><rect class="legend-box" x="585" y="572" width="184" height="66" rx="6"/><rect class="role-control" x="595" y="575" width="14" height="14" rx="3"/><text class="legend-label" x="617" y="584" text-anchor="start">控制</text><rect class="role-capability" x="595" y="593" width="14" height="14" rx="3"/><text class="legend-label" x="617" y="602" text-anchor="start">能力</text><rect class="role-interaction" x="595" y="611" width="14" height="14" rx="3"/><text class="legend-label" x="617" y="620" text-anchor="start">交互</text></g><text class="caption" x="396.5" y="677" text-anchor="middle">图 3-1 · OAuth 2.0 授权码模式：浏览器首次登录完整时序</text></svg>