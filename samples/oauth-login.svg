<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 684" width="758" height="684" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>OAuth 2.0 授权码模式登录时序</title><desc>图 3-1 · OAuth 2.0 授权码模式：浏览器首次登录完整时序</desc><style>:root {
--canvas: #f8fafc;
--panel: #ffffff;
--panel-border: #e2e8f0;
--text: #0f172a;
--muted: #64748b;
--arrow: #94a3b8;
--grid: #e2e8f0;
--role-control-fill: #fdf4ff;
--role-control-stroke: #c084fc;
--role-control-text: #7e22ce;
--role-capability-fill: #f0fdf4;
--role-capability-stroke: #4ade80;
--role-capability-text: #166534;
--role-interaction-fill: #eff6ff;
--role-interaction-stroke: #60a5fa;
--role-interaction-text: #1e40af;
--role-warn-fill: #fef2f2;
--role-warn-stroke: #ef4444;
--role-warn-text: #b91c1c;
--role-neutral-fill: #f8fafc;
--role-neutral-stroke: #94a3b8;
--role-neutral-text: #475569;
}
@media (prefers-color-scheme: dark) {
  :root {
  --canvas: #0f172a;
  --panel: #1e293b;
  --panel-border: #334155;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --arrow: #64748b;
  --grid: #1e293b;
  --role-control-fill: rgba(168,85,247,0.18);
  --role-control-stroke: #c084fc;
  --role-control-text: #e9d5ff;
  --role-capability-fill: rgba(74,222,128,0.16);
  --role-capability-stroke: #4ade80;
  --role-capability-text: #bbf7d0;
  --role-interaction-fill: rgba(96,165,250,0.16);
  --role-interaction-stroke: #60a5fa;
  --role-interaction-text: #dbeafe;
  --role-warn-fill: rgba(239,68,68,0.16);
  --role-warn-stroke: #f87171;
  --role-warn-text: #fecaca;
  --role-neutral-fill: rgba(148,163,184,0.14);
  --role-neutral-stroke: #94a3b8;
  --role-neutral-text: #cbd5e1;
  }
}

svg { background: var(--canvas); }
.title { fill: var(--text); font-size: 22px; font-weight: 700; }
.desc { fill: var(--muted); font-size: 12px; }
.caption { fill: var(--muted); font-size: 12px; }
.frame { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.25; }
.frame-label { fill: var(--muted); font-size: 12px; font-weight: 600; }
.node { stroke-width: 1.5; }
.n-label { fill: var(--text); font-size: 14px; font-weight: 700; dominant-baseline: central; }
.n-sub { fill: var(--muted); font-size: 11px; dominant-baseline: central; }
.edge { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
.edge-dashed { stroke-dasharray: 5 4; }
.edge-label { fill: var(--muted); font-size: 11px; dominant-baseline: central; }
.lifeline { fill: none; stroke: var(--arrow); stroke-width: 1.25; stroke-dasharray: 4 4; }
.legend-box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1; }
.legend-label { fill: var(--text); font-size: 11px; dominant-baseline: central; }
.arrow-fill { fill: var(--arrow); }
.arrow-line { fill: none; stroke: var(--arrow); stroke-width: 1.4; }
.role-control { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-control .node { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-capability { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-capability .node { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-interaction { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-interaction .node { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-warn { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-warn .node { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-neutral { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }
.role-neutral .node { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }</style><style>.edge-label-bg{fill:var(--canvas);stroke:none;}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-fill" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="arrow-async" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker><marker id="arrow-fallback" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker></defs><text class="title" x="379" y="32" text-anchor="middle">OAuth 2.0 授权码模式登录时序</text><path class="lifeline" d="M 71.5 92 L 71.5 552"/><path class="lifeline" d="M 274.5 92 L 274.5 552"/><path class="lifeline" d="M 477.5 92 L 477.5 552"/><path class="lifeline" d="M 680.5 92 L 680.5 552"/><path class="edge" d="M 71.5 104 L 274.5 104" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="105.2" y="111" width="135.6" height="14" rx="3"/><text class="edge-label" x="173" y="121" text-anchor="middle">GET /profile（未登录）</text><path class="edge edge-dashed" d="M 274.5 148 L 71.5 148" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="134.35" y="155" width="77.3" height="14" rx="3"/><text class="edge-label" x="173" y="165" text-anchor="middle">302 → 授权页</text><path class="edge" d="M 71.5 192 L 477.5 192" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="290.65" y="185" width="92.7" height="14" rx="3"/><text class="edge-label" x="337" y="195" text-anchor="middle">GET /authorize</text><path class="edge edge-dashed" d="M 477.5 236 L 71.5 236" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="290.73" y="229" width="96.55" height="14" rx="3"/><text class="edge-label" x="339" y="239" text-anchor="middle">302 + code 回调</text><path class="edge" d="M 71.5 280 L 274.5 280" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="114.55" y="287" width="116.9" height="14" rx="3"/><text class="edge-label" x="173" y="297" text-anchor="middle">GET /callback?code</text><path class="edge" d="M 274.5 324 L 477.5 324" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="296.1" y="331" width="159.8" height="14" rx="3"/><text class="edge-label" x="376" y="341" text-anchor="middle">POST /token（code 换令牌）</text><path class="edge edge-dashed" d="M 477.5 368 L 274.5 368" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="335.7" y="375" width="80.6" height="14" rx="3"/><text class="edge-label" x="376" y="385" text-anchor="middle">access_token</text><path class="edge" d="M 274.5 412 L 680.5 412" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="493.63" y="405" width="120.75" height="14" rx="3"/><text class="edge-label" x="554" y="415" text-anchor="middle">GET /user（Bearer）</text><path class="edge edge-dashed" d="M 680.5 456 L 274.5 456" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="492" y="449" width="52" height="14" rx="3"/><text class="edge-label" x="518" y="459" text-anchor="middle">用户资源</text><path class="edge edge-dashed" d="M 274.5 500 L 71.5 500" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="129.4" y="507" width="87.2" height="14" rx="3"/><text class="edge-label" x="173" y="517" text-anchor="middle">200 渲染个人页</text><g class="role-interaction"><rect class="node" x="24" y="52" width="96" height="34" rx="8"/><text class="n-label" x="126" y="69" text-anchor="middle">浏览器</text></g><g class="role-control"><rect class="node" x="223" y="52" width="104" height="34" rx="8"/><text class="n-label" x="329" y="69" text-anchor="middle">WebApp 后端</text></g><g class="role-control"><rect class="node" x="424" y="52" width="107" height="34" rx="8"/><text class="n-label" x="532" y="69" text-anchor="middle">AuthService</text></g><g class="role-capability"><rect class="node" x="627" y="52" width="107" height="34" rx="8"/><text class="n-label" x="735" y="69" text-anchor="middle">ResourceAPI</text></g><g class="legend"><rect class="legend-box" x="556" y="568" width="178" height="66" rx="6"/><rect class="role-control" x="566" y="571" width="14" height="14" rx="3"/><text class="legend-label" x="588" y="580" text-anchor="start">控制</text><rect class="role-capability" x="566" y="589" width="14" height="14" rx="3"/><text class="legend-label" x="588" y="598" text-anchor="start">能力</text><rect class="role-interaction" x="566" y="607" width="14" height="14" rx="3"/><text class="legend-label" x="588" y="616" text-anchor="start">交互</text></g><text class="caption" x="379" y="673" text-anchor="middle">图 3-1 · OAuth 2.0 授权码模式：浏览器首次登录完整时序</text></svg>