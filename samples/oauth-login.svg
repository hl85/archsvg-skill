<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 670" width="786" height="670" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>OAuth 2.0 授权码模式登录时序</title><desc>图 3-1 · OAuth 2.0 授权码模式：浏览器首次登录完整时序</desc><style>:root {
--canvas: #f8fafc;
--panel: #ffffff;
--panel-border: #e2e8f0;
--text: #0f172a;
