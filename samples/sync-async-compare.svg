class="role-interaction"><rect class="node" x="154" y="240" width="96" height="46" rx="8"/><text class="n-label" x="390" y="240" text-anchor="middle">EventBus</text><text class="n-sub" x="390" y="254" text-anchor="middle">订单事件</text></g><g class="role-capability"><rect class="node" x="266" y="240" width="121" height="46" rx="8"/><text class="n-label" x="515" y="240" text-anchor="middle">OrderConsumer</text><text class="n-sub" x="515" y="254" text-anchor="middle">消费·建单</text></g><g class="role-capability"><rect class="node" x="403" y="240" width="135" height="46" rx="8"/><text class="n-label" x="659" y="240" text-anchor="middle">PaymentConsumer</text><text class="n-sub" x="659" y="254" text-anchor="middle">消费·扣款</text></g><g class="role-neutral"><rect class="node" x="554" y="240" width="128" height="46" rx="8"/><text class="n-label" x="806" y="240" text-anchor="middle">NotifyConsumer</text><text class="n-sub" x="806" y="254" text-anchor="middle">消费·通知</text></g><g class="legend"><rect class="legend-box" x="414" y="320" width="286" height="102" rx="6"/><rect class="role-control" x="424" y="323" width="14" height="14" rx="3"/><text class="legend-label" x="446" y="332" text-anchor="start">控制</text><rect class="role-capability" x="424" y="341" width="14" height="14" rx="3"/><text class="legend-label" x="446" y="350" text-anchor="start">能力</text><rect class="role-interaction" x="424" y="359" width="14" height="14" rx="3"/><text class="legend-label" x="446" y="368" text-anchor="start">交互</text><rect class="role-warn" x="424" y="377" width="14" height="14" rx="3"/><text class="legend-label" x="446" y="386" text-anchor="start">告警</text><rect class="role-neutral" x="424" y="395" width="14" height="14" rx="3"/><text class="legend-label" x="446" y="404" text-anchor="start">中性</text></g><text class="caption" x="362" y="461" text-anchor="middle">图 1-2 · 下单链路对比：同步阻塞 vs 事件驱动（并列对比变体）</text></svg>