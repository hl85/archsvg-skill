  --role-neutral-fill: rgba(148,163,184,0.14);
  --role-neutral-stroke: #94a3b8;
  --role-neutral-text: #cbd5e1;
  }
}

svg { background: var(--canvas); }
.title { fill: var(--text); font-size: 24px; font-weight: 700; }
.desc { fill: var(--muted); font-size: 12px; }
.caption { fill: var(--muted); font-size: 12px; }
.frame { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.25; }
.frame-label { fill: var(--text); font-size: 13px; font-weight: 700; }
.node { stroke-width: 1.5; }
.n-label { fill: var(--text); font-size: 16px; font-weight: 700; dominant-baseline: central; }
.n-sub { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
.edge { fill: none; stroke: var(--arrow); stroke-width: 2; }
.edge-dashed { stroke-dasharray: 5 4; }
.edge-label { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
.lifeline { fill: none; stroke: var(--arrow); stroke-width: 1.5; stroke-dasharray: 4 4; }
.legend-box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1; }
.legend-label { fill: var(--text); font-size: 12px; dominant-baseline: central; }
.arrow-fill { fill: var(--arrow); }
.arrow-line { fill: none; stroke: var(--arrow); stroke-width: 1.4; }
.role-control { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-control .node { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-capability { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-capability .node { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-interaction { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-interaction .node { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-warn { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-warn .node { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-neutral { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }
.role-neutral .node { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }</style><style>.edge-label-bg{fill:var(--canvas);stroke:none;}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-fill" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="arrow-async" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker><marker id="arrow-fallback" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker></defs><text class="title" x="403" y="32" text-anchor="middle">同步阻塞 vs 事件驱动的下单链路</text><g><rect class="frame" x="24" y="76" width="758" height="90" rx="10"/><text class="frame-label" x="36" y="94">同步链路 · 受理即串行执行</text></g><g><rect class="frame" x="24" y="236" width="758" height="90" rx="10"/><text class="frame-label" x="36" y="254">异步链路 · 受理与执行解耦</text></g><path class="edge" d="M 96 94 L 96 80 L 278 80 L 278 94" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="172" y="59" width="30" height="14" rx="3"/><text class="edge-label" x="187" y="69" text-anchor="middle">下单</text><path class="edge" d="M 278 94 L 278 80 L 484 80 L 484 94" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="355" y="49" width="52" height="14" rx="3"/><text class="edge-label" x="381" y="59" text-anchor="middle">扣款阻塞</text><path class="edge" d="M 278 94 L 278 80 L 693 80 L 693 94" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="460" y="49" width="52" height="14" rx="3"/><text class="edge-label" x="486" y="59" text-anchor="middle">核销阻塞</text><path class="edge edge-dashed" d="M 96 254 L 96 240 L 214 240 L 214 254" marker-end="url(#arrow-async)"/><rect class="edge-label-bg" x="118" y="219" width="74" height="14" rx="3"/><text class="edge-label" x="155" y="229" 