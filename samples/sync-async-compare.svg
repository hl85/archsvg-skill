<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 494" width="806" height="494" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>同步阻塞 vs 事件驱动的下单链路</title><desc>图 1-2 · 下单链路对比：同步阻塞 vs 事件驱动（并列对比变体）</desc><style>:root {
