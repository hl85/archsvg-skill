svg { background: var(--canvas); }
.title { fill: var(--text); font-size: 22px; font-weight: 700; }
.desc { fill: var(--muted); font-size: 12px; }
.caption { fill: var(--muted); font-size: 12px; }
.frame { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.25; }
.frame-label { fill: var(--text); font-size: 12px; font-weight: 700; }
.node { stroke-width: 1.5; }
.n-label { fill: var(--text); font-size: 14px; font-weight: 700; dominant-baseline: central; }
.n-sub { fill: var(--muted); font-size: 11px; dominant-baseline: central; }
.edge { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
.edge-dashed { stroke-dasharray: 5 4; }
.edge-label { fill: var(--muted); font-size: 11px; dominant-baseline: central; }
.lifeline { fill: none; stroke: var(--arrow); stroke-width: 1.25; stroke-dasharray: 4 4; }
.legend-box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1; }
.legend-label { fill: var(--text); font-size: 11px; dominant-baseline: central; }
.arrow-fill { fill: var(--arrow); }
.arrow-line { fill: none; stroke: var(--arrow); stroke-width: 1.4; }
.role-control { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-control .node { fill: var(--role-control-fill); stroke: var(--role-control-stroke); }
.role-capability { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-capability .node { fill: var(--role-capability-fill); stroke: var(--role-capability-stroke); }
.role-interaction { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-interaction .node { fill: var(--role-interaction-fill); stroke: var(--role-interaction-stroke); }
.role-warn { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-warn .node { fill: var(--role-warn-fill); stroke: var(--role-warn-stroke); }
.role-neutral { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }
.role-neutral .node { fill: var(--role-neutral-fill); stroke: var(--role-neutral-stroke); }</style><style>.edge-label-bg{fill:var(--canvas);stroke:none;}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-fill" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="arrow-async" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker><marker id="arrow-fallback" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-line" d="M0,0 L8,4 L0,8"/></marker></defs><text class="title" x="250" y="32" text-anchor="middle">电商订单系统分层架构</text><g><rect class="frame" x="121" y="62" width="259" height="82" rx="10"/><text class="frame-label" x="133" y="80">接入层</text></g><g><rect class="frame" x="24" y="214" width="452" height="82" rx="10"/><text class="frame-label" x="36" y="232">服务层</text></g><g><rect class="frame" x="72" y="366" width="356" height="82" rx="10"/><text class="frame-label" x="84" y="384">存储层</text></g><path class="edge" d="M 189 80 L 189 66 L 308 66 L 308 80" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="215.85" y="45" width="66.3" height="14" rx="3"/><text class="edge-label" x="249" y="55" text-anchor="middle">token 校验</text><path class="edge" d="M 189 126 L 189 179 L 99 179 L 99 232" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="118" y="186" width="52" height="14" rx="3"/><text class="edge-label" x="144" y="196" text-anchor="middle">创建订单</text><path class="edge" d="M 99 232 L 99 218 L 243 218 L 243 232" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="145" y="293" width="52" height="14" rx="3"/><text class="edge-label" x="171" y="303" text-anchor="middle">锁定库存</text><path class="edge" d="M 99 232 L 99 218 L 394 218 L 394 232" marker-end="url(#arrow)"/><rect class="e