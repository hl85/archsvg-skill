<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 598" width="500" height="598" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>电商订单系统分层架构</title><desc>图 1-1 · 电商订单系统分层架构（接入 / 服务 / 存储）</desc><style>:root {
