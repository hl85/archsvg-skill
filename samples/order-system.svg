aymentService</text><text class="n-sub" x="394" y="264" text-anchor="middle">支付网关适配</text></g><g class="role-neutral"><rect class="node" x="90" y="384" width="96" height="46" rx="8"/><text class="n-label" x="138" y="402" text-anchor="middle">MySQL</text><text class="n-sub" x="138" y="416" text-anchor="middle">订单主库</text></g><g class="role-neutral"><rect class="node" x="202" y="384" width="96" height="46" rx="8"/><text class="n-label" x="250" y="402" text-anchor="middle">Redis</text><text class="n-sub" x="250" y="416" text-anchor="middle">幂等锁</text></g><g class="role-interaction"><rect class="node" x="314" y="384" width="96" height="46" rx="8"/><text class="n-label" x="362" y="402" text-anchor="middle">RocketMQ</text><text class="n-sub" x="362" y="416" text-anchor="middle">订单事件</text></g><g class="legend"><rect class="legend-box" x="244" y="464" width="232" height="84" rx="6"/><rect class="role-control" x="254" y="467" width="14" height="14" rx="3"/><text class="legend-label" x="276" y="476" text-anchor="start">控制</text><rect class="role-capability" x="254" y="485" width="14" height="14" rx="3"/><text class="legend-label" x="276" y="494" text-anchor="start">能力</text><rect class="role-interaction" x="254" y="503" width="14" height="14" rx="3"/><text class="legend-label" x="276" y="512" text-anchor="start">交互</text><rect class="role-neutral" x="254" y="521" width="14" height="14" rx="3"/><text class="legend-label" x="276" y="530" text-anchor="start">中性</text></g><text class="caption" x="250" y="587" text-anchor="middle">图 1-1 · 电商订单系统分层架构（接入 / 服务 / 存储）</text></svg>