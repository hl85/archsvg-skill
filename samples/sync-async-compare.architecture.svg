42" y="222" width="96" height="46" rx="8"/><text class="n-label" x="390" y="240" text-anchor="middle">EventBus</text><text class="n-sub" x="390" y="254" text-anchor="middle">订单事件</text></g><g class="role-capability"><rect class="node" x="454" y="222" width="121" height="46" rx="8"/><text class="n-label" x="515" y="240" text-anchor="middle">OrderConsumer</text><text class="n-sub" x="515" y="254" text-anchor="middle">消费·建单</text></g><g class="role-capability"><rect class="node" x="591" y="222" width="135" height="46" rx="8"/><text class="n-label" x="659" y="240" text-anchor="middle">PaymentConsumer</text><text class="n-sub" x="659" y="254" text-anchor="middle">消费·扣款</text></g><g class="role-neutral"><rect class="node" x="742" y="222" width="128" height="46" rx="8"/><text class="n-label" x="806" y="240" text-anchor="middle">NotifyConsumer</text><text class="n-sub" x="806" y="254" text-anchor="middle">消费·通知</text></g><g class="legend"><rect class="legend-box" x="790" y="394" width="286" height="102" rx="6"/><rect class="role-control" x="800" y="397" width="14" height="14" rx="3"/><text class="legend-label" x="822" y="406" text-anchor="start">控制</text><rect class="role-capability" x="800" y="415" width="14" height="14" rx="3"/><text class="legend-label" x="822" y="424" text-anchor="start">能力</text><rect class="role-interaction" x="800" y="433" width="14" height="14" rx="3"/><text class="legend-label" x="822" y="442" text-anchor="start">交互</text><rect class="role-warn" x="800" y="451" width="14" height="14" rx="3"/><text class="legend-label" x="822" y="460" text-anchor="start">告警</text><rect class="role-neutral" x="800" y="469" width="14" height="14" rx="3"/><text class="legend-label" x="822" y="478" text-anchor="start">中性</text></g></svg>